services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      WATCHLIST_DB_PASSWORD: ${WATCHLIST_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [microworld]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [microworld]

  auth:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Auth
    restart: unless-stopped
    environment:
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_auth
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_users_db
      DB_TIMEZONE: "+00:00"
      SECRET_KEY: ${JWT_SECRET_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
    networks: [microworld]

  catalog:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Catalog
    restart: unless-stopped
    environment:
      PORT: 4001
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_catalog
      MYSQL_PASSWORD: ${CATALOG_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_catalog_db
      DB_TIMEZONE: "+00:00"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    volumes:
      - catalog_uploads:/repo/Backend/Catalog/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [microworld]

  order:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Order
    restart: unless-stopped
    environment:
      PORT: 4002
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_order
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_orders_db
      DB_TIMEZONE: "+00:00"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4002/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [microworld]

  watchlist:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Watchlist
    restart: unless-stopped
    environment:
      PORT: 4003
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_watchlist
      MYSQL_PASSWORD: ${WATCHLIST_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_watchlist_db
      DB_TIMEZONE: "+00:00"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
    networks: [microworld]

  payment:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Payment
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_payment
      MYSQL_PASSWORD: ${PAYMENT_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_payments_db
      DB_TIMEZONE: "+00:00"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [microworld]

  notification:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Notification
    restart: unless-stopped
    environment:
      PORT: 4004
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_notification
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_notifications_db
      DB_TIMEZONE: "+00:00"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4004/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [microworld]

  analytics:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Analytics
    restart: unless-stopped
    environment:
      PORT: 4005
      MYSQL_HOST: mysql
      MYSQL_USER: micro_world_analytics
      MYSQL_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      MYSQL_DATABASE: micro_world_analytics_db
      DB_TIMEZONE: "+00:00"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4005/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [microworld]

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        SERVICE_DIR: Backend/Gateway
    restart: unless-stopped
    environment:
      PORT: 80
      AUTH_SERVICE_URL: http://auth:4000
      CATALOG_SERVICE_URL: http://catalog:4001
      ORDER_SERVICE_URL: http://order:4002
      WATCHLIST_SERVICE_URL: http://watchlist:4003
      NOTIFICATION_SERVICE_URL: http://notification:4004
      ANALYTICS_SERVICE_URL: http://analytics:4005
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8081:80"
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
      watchlist:
        condition: service_healthy
      notification:
        condition: service_healthy
      analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [microworld]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks: [microworld]

volumes:
  mysql_data:
  catalog_uploads:

networks:
  microworld:
